# Kripto fiyat (CoinGecko) + XAUT/PAXG emtia token.
# price_history snapshot kapalı (021).
#
# Zamanlama GitHub cron ile değil: Supabase pg_cron (~5 dk) → Edge dispatch-crypto-sync
# → bu workflow workflow_dispatch ile tetiklenir.
# Doküman: docs/SUPABASE-CRYPTO-SYNC.md
name: Crypto sync

on:
  workflow_dispatch:

concurrency:
  group: crypto-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # Tam `npm ci` yok: 5 dk kadansta Expo ağacını kurmak gereksiz.
      - name: Install script runtime
        run: |
          mkdir -p "$RUNNER_TEMP/crypto-sync-npm"
          npm install --prefix "$RUNNER_TEMP/crypto-sync-npm" --no-package-lock --omit=dev @supabase/supabase-js@2.99.0

      - name: Export env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV

      - name: Sync crypto (CoinGecko)
        env:
          NODE_PATH: ${{ runner.temp }}/crypto-sync-npm/node_modules
        run: node scripts/sync-crypto-prices.js
