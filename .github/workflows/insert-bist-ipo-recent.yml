# Son BIST halka arz tohumu: INTET, BKRGY, TKNKA, KPEKS, VEYAS
# Merge / script güncellemesinde otomatik; manuel: workflow_dispatch
name: Insert BIST IPO recent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/insert-bist-ipo-recent.js'
      - '.github/workflows/insert-bist-ipo-recent.yml'

jobs:
  insert:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Export env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV

      - name: Insert recent BIST IPO assets
        run: npm run insert:bist-ipo-recent
